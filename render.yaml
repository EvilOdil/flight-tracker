# Render blueprint — deploy with "New > Blueprint" pointing at this repo.
# Gives HTTPS + WSS automatically; devices connect to wss://<service>.onrender.com/ws/device
services:
  - type: web
    name: flight-tracker
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/devices
    envVars:
      # TEMPORARY: serve the panel-calibration pattern instead of aircraft
      # photos (see server.js calibrationJpg). Set back to "0" after the
      # panel's colour response has been measured.
      - key: PHOTO_CAL
        value: "1"
