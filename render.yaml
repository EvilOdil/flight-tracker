# Render blueprint — deploy with "New > Blueprint" pointing at this repo.
# Gives HTTPS + WSS automatically; devices connect to wss://<service>.onrender.com/ws/device
services:
  - type: web
    name: flight-tracker
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/devices
    envVars:
      # Photo mode (server.js): "0" = real aircraft photos (production),
      # "1" = raw panel test pattern served instead of every photo (hardware
      # diagnosis only — this is how the ILI9486-vs-ILI9488 driver mismatch
      # was found). Keep "0". The former tone/green calibration modes and
      # their PANEL_* env vars were removed 2026-07-09 with the driver fix.
      - key: PHOTO_CAL
        value: "0"
