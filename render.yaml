# Render blueprint — deploy with "New > Blueprint" pointing at this repo.
# Gives HTTPS + WSS automatically; devices connect to wss://<service>.onrender.com/ws/device
services:
  - type: web
    name: flight-tracker
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/devices
    envVars:
      # Calibration mode (server.js calibrationJpg): "1" = raw test pattern,
      # "2" = pattern through the tone-compensation LUTs, "0" = real photos.
      # TEMPORARILY "2" to verify the tone compensation on the glass; set to
      # "0" once the grey order / sky-blue patch check out.
      - key: PHOTO_CAL
        value: "2"
