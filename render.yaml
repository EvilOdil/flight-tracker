# Render blueprint — deploy with "New > Blueprint" pointing at this repo.
# Gives HTTPS + WSS automatically; devices connect to wss://<service>.onrender.com/ws/device
services:
  - type: web
    name: flight-tracker
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/devices
    envVars:
      # Calibration mode (server.js calibrationJpg): "1" serves a test
      # pattern instead of aircraft photos. Measured 2026-07-09: the full
      # chain renders colours faithfully — keep "0".
      - key: PHOTO_CAL
        value: "0"
