# Render blueprint — deploy with "New > Blueprint" pointing at this repo.
# Gives HTTPS + WSS automatically; devices connect to wss://<service>.onrender.com/ws/device
services:
  - type: web
    name: flight-tracker
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/devices
    envVars:
      # Calibration mode (server.js): "1" = raw test pattern, "2" = pattern
      # through the tone LUTs, "3" = green-gamma tuning grid, "0" = photos.
      # Calibrated 2026-07-09 (tone scale + piecewise green curve) — keep "0".
      - key: PHOTO_CAL
        value: "0"
